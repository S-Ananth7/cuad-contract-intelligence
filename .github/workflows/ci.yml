name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: cuad
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: cuad
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cuad -d cuad"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://cuad:ci_only_password@localhost:5432/cuad
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[dev,api]"

      - name: Lint
        run: ruff check .

      - name: Create tables
        run: |
          psql "$DATABASE_URL" -c "CREATE EXTENSION IF NOT EXISTS vector"
          psql "$DATABASE_URL" -f sql/schema.sql

      - name: Cache the embedding model
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/fastembed
          key: fastembed-bge-small-en-v1.5

      - name: Test
        env:
          FASTEMBED_CACHE_PATH: ${{ runner.temp }}/fastembed
        run: python -m pytest -q
