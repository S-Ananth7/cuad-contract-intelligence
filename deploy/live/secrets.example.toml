# Paste your own values into the app's Secrets box on Streamlit Cloud (Settings > Secrets).
# Never put real values in this file or anywhere in the repository.
DATABASE_URL = "postgresql://USER:PASSWORD@HOST/DBNAME?sslmode=require"
LLM_API_KEY = "your-model-key"
LLM_BASE_URL = "your-provider-base-url"
LLM_MODEL = "your-model-name"
LLM_THINKING = "off"

# Sign-in providers to offer, and (for Microsoft) the Entra tenant ids of the organisations you trust.
LIVE_SIGNIN_PROVIDERS = "google,microsoft"
LIVE_TRUSTED_MS_TENANTS = "11111111-2222-3333-4444-555555555555"
# Optional: the address of the public read-only sample app. Adds a "View sample results" link to the sign-in screen.
# LIVE_SAMPLE_URL = "https://your-sample-app.streamlit.app"
LIVE_DAILY_CAP = "10"
LIVE_TOKEN_CAP = "300000"

# Sign-in (Streamlit's built-in OpenID Connect). Register an OAuth app with each provider; see docs/deploy-live.md.
[auth]
redirect_uri = "https://YOUR-APP.streamlit.app/oauth2callback"
cookie_secret = "a-long-random-string"

[auth.google]
client_id = "your-google-client-id"
client_secret = "your-google-client-secret"
server_metadata_url = "https://accounts.google.com/.well-known/openid-configuration"

[auth.microsoft]
client_id = "your-microsoft-application-id"
client_secret = "your-microsoft-client-secret"
server_metadata_url = "https://login.microsoftonline.com/YOUR-ENTRA-TENANT-ID/v2.0/.well-known/openid-configuration"
