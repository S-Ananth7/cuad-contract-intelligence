[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cuad-ai"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["pydantic", "openai", "python-dotenv", "psycopg[binary]", "fastembed"]

[project.optional-dependencies]
api = ["fastapi", "uvicorn"]
dev = ["pytest", "ruff", "pre-commit", "httpx"]

[project.scripts]
cuad = "cuad_ai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pyright]
extraPaths = ["src"]

[tool.pyrefly]
search-path = ["src"]

[tool.ruff]
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I"]   # errors, unused names, import order
ignore = ["E501"]          # line length is a formatter's job; formatting is a separate step
