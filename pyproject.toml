[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cuad-ai"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2",
    "openai>=1",
    "python-dotenv>=1",
    "psycopg[binary]>=3.1",
    "fastembed>=0.3",
]

[project.optional-dependencies]
api = ["fastapi>=0.100", "uvicorn>=0.20"]
dev = ["pytest>=7", "ruff>=0.4", "pre-commit>=3", "httpx>=0.24"]

[project.scripts]
cuad = "cuad_ai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pyright]
extraPaths = ["src"]

[tool.pyrefly]
search-path = ["src"]

[tool.ruff]
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I"]   # errors, unused names, import order
ignore = ["E501"]          # line length is a formatter's job; formatting is a separate step
