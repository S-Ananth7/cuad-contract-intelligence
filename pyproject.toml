[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cuad-ai"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["pydantic", "openai", "python-dotenv", "psycopg[binary]", "fastembed"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pyright]
extraPaths = ["src"]

[tool.pyrefly]
search-path = ["src"]
